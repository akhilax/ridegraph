<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideGraph - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Ride<span>Graph</span><small>Admin</small></div>
    <div class="who">Hi, <b id="who"></b> <button class="ghost" onclick="logout()">Logout</button></div>
  </div>

  <div class="container">
    <div id="stats"><div class="loading">Loading statistics...</div></div>
    <div class="grid" id="details"></div>
  </div>

  <script src="app.js"></script>
  <script>
    requireRole("admin");

    async function load() {
      try {
        const s = await api("GET", "/api/admin/stats");
        // Four headline numbers; each one counts up from 0.
        const cards = [
          ["Total rides", s.total_rides, v => Math.round(v)],
          ["Revenue", s.revenue, v => money(v)],
          ["Completed", s.completed_rides, v => Math.round(v)],
          ["Cancellations", s.cancellation_count, v => Math.round(v)],
        ];
        document.getElementById("stats").innerHTML = `<div class="stats">` + cards.map((c, i) =>
          `<div class="stat" style="animation-delay:${i * 0.07}s"><div class="n" data-i="${i}">0</div><div class="l">${c[0]}</div></div>`).join("") + `</div>`;
        cards.forEach((c, i) => countUp(document.querySelector(`[data-i="${i}"]`), c[1], c[2]));

        const max = Math.max(1, ...s.rides_per_zone.map(z => z.rides));
        const bars = s.rides_per_zone.map((z, i) => `
          <div class="bar-row"><div class="name">${esc(z.zone_name)}</div>
          <div class="bar" style="width:${(z.rides / max) * 55}%;animation-delay:${i * 0.08}s"></div> <b>${z.rides}</b></div>`).join("");

        const drivers = s.top_drivers.map((d, i) => `
          <tr style="animation-delay:${i * 0.07}s"><td>${esc(d.name)}</td><td>★ ${Number(d.rating_avg).toFixed(2)}</td><td>${d.completed_rides}</td></tr>`).join("");

        const by = s.cancellations_by;
        document.getElementById("details").innerHTML = `
          <div class="card anim d1"><h2>Rides per zone</h2>${bars}</div>
          <div class="card anim d2"><h2>Top-rated drivers</h2>
            <table><thead><tr><th>Driver</th><th>Rating</th><th>Rides</th></tr></thead><tbody>${drivers}</tbody></table>
            <p class="meta" style="margin:14px 0 0">Cancellations: ${by.rider || 0} by riders · ${by.driver || 0} by drivers · ${s.riders} riders · ${s.drivers} drivers in total</p></div>`;
      } catch (e) {
        document.getElementById("stats").innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
