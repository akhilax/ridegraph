<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideGraph - Rider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Ride<span>Graph</span><small>Rider</small></div>
    <div class="who">Hi, <b id="who"></b> <button class="ghost" onclick="logout()">Logout</button></div>
  </div>

  <div class="container grid">
    <!-- LEFT: booking -->
    <div>
      <div class="card anim">
        <h2>Where to?</h2>
        <div id="bookLoading" class="loading">Loading locations...</div>
        <div id="bookForm" class="hidden">
          <div class="split">
            <div><label for="pickup">Pickup</label><select id="pickup"></select></div>
            <div><label for="dropoff">Dropoff</label><select id="dropoff"></select></div>
          </div>
          <label>Ride type</label>
          <div class="types" id="types"></div>

          <details class="fold" style="margin-top:16px">
            <summary>Have a promo code?</summary>
            <div class="inner"><input id="promo" placeholder="e.g. WELCOME20"></div>
          </details>

          <div id="estimate"></div>
          <div id="bookMsg"></div>
          <button id="bookBtn" class="big" disabled>Request ride</button>
        </div>
      </div>

      <div class="card anim d1">
        <details class="fold" id="nearbyFold">
          <summary><span id="nearbyTitle">Drivers near pickup</span></summary>
          <div class="inner" id="nearby"></div>
        </details>
      </div>
    </div>

    <!-- RIGHT: rides -->
    <div>
      <div class="card anim d1 hidden" id="currentCard">
        <h2>Current ride</h2>
        <div id="activeRides"></div>
      </div>
      <div class="card anim d2">
        <h2>Ride history <span class="count" id="histCount">0</span></h2>
        <div id="history"><div class="loading">Loading...</div></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const me = requireRole("rider");
    const $ = id => document.getElementById(id);
    let rideTypes = [], selectedType = null;

    // ---------- booking form ----------
    async function initBooking() {
      try {
        const [locations, types] = await Promise.all([api("GET", "/api/locations"), api("GET", "/api/ride-types")]);
        rideTypes = types;
        const opts = locations.map(l =>
          `<option value="${esc(l.location_id)}">${esc(l.address)}</option>`).join("");
        $("pickup").innerHTML = opts;
        $("dropoff").innerHTML = opts;
        $("pickup").value = "L1"; $("dropoff").value = "L4";   // sensible defaults
        selectedType = rideTypes.find(t => t.type_name === "Economy")?.ride_type_id || rideTypes[0].ride_type_id;
        renderTypes();
        $("bookLoading").classList.add("hidden");
        $("bookForm").classList.remove("hidden");
        updateEstimate(); updateNearby();
      } catch (e) {
        $("bookLoading").innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
      }
    }

    function renderTypes() {
      $("types").innerHTML = rideTypes.map(t => `
        <div class="type ${t.ride_type_id === selectedType ? "sel" : ""}" data-id="${esc(t.ride_type_id)}">
          <b>${esc(t.type_name)}</b>₹${t.base_fare} + ₹${t.per_km_rate}/km
        </div>`).join("");
      document.querySelectorAll(".type").forEach(el => el.onclick = () => {
        selectedType = el.dataset.id; renderTypes(); updateEstimate();
      });
    }

    // Fare estimate (calls /api/fare-estimate). Latest request wins.
    let estimateToken = 0;
    async function updateEstimate() {
      const token = ++estimateToken;
      $("bookBtn").disabled = true;
      showMsg("bookMsg", "");
      if ($("pickup").value === $("dropoff").value) {
        $("estimate").innerHTML = `<div class="msg error">Pickup and dropoff must be different.</div>`;
        return;
      }
      try {
        const e = await api("POST", "/api/fare-estimate", {
          pickup_id: $("pickup").value, dropoff_id: $("dropoff").value,
          ride_type_id: selectedType, promo_code: $("promo").value });
        if (token !== estimateToken) return;
        $("estimate").innerHTML = `
          <div class="estimate">
            <div><b>${e.distance_km} km</b> · ${esc(e.ride_type)}
              <div class="sub">${e.promo_code ? esc(e.promo_code) + " applied: " + e.discount_percent + "% off" : "Straight-line distance"}</div></div>
            <div class="fare">${e.discount_percent ? `<s>${money(e.fare_before_discount)}</s>` : ""}${money(e.fare_amount)}</div>
          </div>`;
        $("bookBtn").disabled = false;
      } catch (err) {
        if (token === estimateToken) $("estimate").innerHTML = `<div class="msg error">${esc(err.message)}</div>`;
      }
    }

    async function updateNearby() {
      try {
        const ds = await api("GET", `/api/locations/${$("pickup").value}/nearby-drivers`);
        $("nearbyTitle").textContent = ds.length + (ds.length === 1 ? " driver" : " drivers") + " near pickup";
        $("nearby").innerHTML = ds.length ? ds.map(d => `
          <div class="drv"><span><b>${esc(d.name)}</b><br><span class="meta">${esc(d.color)} ${esc(d.model)} · ${esc(d.plate_number)}</span></span>
          <span>★ ${Number(d.rating_avg).toFixed(2)}</span></div>`).join("")
          : `<div class="empty">No drivers available in this zone right now.</div>`;
      } catch (e) { $("nearby").innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }

    $("pickup").onchange = () => { updateEstimate(); updateNearby(); };
    $("dropoff").onchange = updateEstimate;
    $("promo").oninput = () => { clearTimeout(window._t); window._t = setTimeout(updateEstimate, 400); };

    $("bookBtn").onclick = async () => {
      $("bookBtn").disabled = true;
      try {
        await api("POST", "/api/rides", {
          user_id: me.user_id, pickup_id: $("pickup").value, dropoff_id: $("dropoff").value,
          ride_type_id: selectedType, promo_code: $("promo").value });
        toast("Ride requested! Waiting for a driver...");
        loadRides();
      } catch (e) { showMsg("bookMsg", e.message, "error"); }
      $("bookBtn").disabled = false;
    };

    // ---------- rides list ----------
    // Expanded details of one ride (what you see after clicking it)
    function rideDetails(r) {
      let h = "";
      if (r.driver_name) {
        h += `<dl class="kv"><dt>Driver</dt><dd><b>${esc(r.driver_name)}</b> · ★ ${Number(r.driver_rating).toFixed(2)}</dd>
          <dt>Vehicle</dt><dd>${esc(r.vehicle_color)} ${esc(r.vehicle_model)} · ${esc(r.plate_number)}</dd>
          <dt>Phone</dt><dd>${esc(r.driver_phone)}</dd></dl>`;
      }
      if (r.promo_code) h += `<div class="meta">Promo ${esc(r.promo_code)} (${r.promo_percent}% off)</div>`;
      if (r.status === "requested") h += `<div class="meta">Searching for a driver...</div>`;
      if (r.status === "accepted") h += `<div class="meta">Your driver is on the way.</div>`;
      if (r.status === "cancelled") h += `<div class="meta">Cancelled by ${esc(r.cancelled_by)}: ${esc(r.cancel_reason)}</div>`;

      if (["requested", "accepted"].includes(r.status)) {
        h += `<div class="row"><button class="ghost small" data-act="cancel" data-id="${esc(r.ride_id)}">Cancel ride</button></div>`;
      }
      if (r.status === "completed") {
        if (r.payment_status === "paid") {
          h += `<div class="meta">Paid ${money(r.payment_amount)} by ${esc(r.payment_method)} ${badge("paid")}</div>`;
        } else {
          h += `<div class="row">
              <select data-pay="${esc(r.ride_id)}" style="width:auto"><option value="upi">UPI</option><option value="card">Card</option><option value="cash">Cash</option></select>
              <button class="gold small" data-act="pay" data-id="${esc(r.ride_id)}">Pay ${money(r.fare_amount)}</button></div>`;
        }
        if (r.rating_score != null) {
          h += `<div class="meta" style="color:var(--gold)">${stars(r.rating_score)} ${esc(r.rating_comment)}</div>`;
        } else {
          h += `<div class="row">
              <select data-score="${esc(r.ride_id)}" style="width:auto">
                <option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
              <input data-comment="${esc(r.ride_id)}" placeholder="Comment (optional)">
              <button class="navy small" data-act="rate" data-id="${esc(r.ride_id)}">Rate</button></div>`;
        }
      }
      return h;
    }

    let busyTyping = false;   // don't refresh the list while the user types a comment
    async function loadRides() {
      if (busyTyping) return;
      try {
        const rides = await api("GET", `/api/users/${me.user_id}/rides`);
        const active = rides.filter(r => ["requested", "accepted"].includes(r.status));
        // A completed ride that still needs payment / rating also stays on top.
        const needsAction = rides.filter(r => r.status === "completed" && (r.payment_status !== "paid" || r.rating_score == null)).slice(0, 1);
        const top = [...active, ...needsAction];
        const rest = rides.filter(r => !top.includes(r));
        $("currentCard").classList.toggle("hidden", !top.length);
        setIfChanged("activeRides", top.map(r => rideItem(r, rideDetails(r), { open: true, live: active.includes(r) })).join(""));
        setIfChanged("history", rest.length ? rest.map(r => rideItem(r, rideDetails(r))).join("") : `<div class="empty">No past rides yet.</div>`);
        $("histCount").textContent = rest.length;
      } catch (e) {
        $("history").innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
      }
    }

    // One click handler for all buttons inside ride rows (event delegation)
    document.addEventListener("click", async ev => {
      const b = ev.target.closest("button[data-act]");
      if (!b) return;
      const id = b.dataset.id, act = b.dataset.act;
      b.disabled = true;
      try {
        if (act === "cancel") {
          if (!confirm("Cancel this ride?")) { b.disabled = false; return; }
          await api("POST", `/api/rides/${id}/cancel`, { cancelled_by: "rider", user_id: me.user_id, reason: "Cancelled by rider" });
          toast("Ride cancelled");
        } else if (act === "pay") {
          await api("POST", `/api/rides/${id}/pay`, { user_id: me.user_id, method: document.querySelector(`[data-pay="${id}"]`).value });
          toast("Payment successful");
        } else if (act === "rate") {
          await api("POST", `/api/rides/${id}/rate`, {
            user_id: me.user_id, score: document.querySelector(`[data-score="${id}"]`).value,
            comment: document.querySelector(`[data-comment="${id}"]`).value });
          toast("Thanks for rating!");
        }
        busyTyping = false; loadRides(); updateNearby();
      } catch (e) {
        showMsg("msg-" + id, e.message, "error"); b.disabled = false;
      }
    });
    document.addEventListener("focusin", e => { busyTyping = e.target.matches("[data-comment]"); });
    document.addEventListener("focusout", () => { busyTyping = false; });

    if (me) { initBooking(); loadRides(); setInterval(loadRides, 5000); }  // auto-refresh status every 5 s
  </script>
</body>
</html>
